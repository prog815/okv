name: Weekly OKV Update

on:
  schedule:
    - cron: '17 6 * * 4'      # 06:17 UTC = 09:17 МСК, четверг (слот ОКВ из §3.2)
  workflow_dispatch:          # ручной запуск

jobs:
  sync-and-trigger:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # Kaggle CLI >= 1.8.0 читает KAGGLE_API_TOKEN напрямую.
      # В репозитории секрет называется KAGGLE_API_TOKEN_OKV, внутри — чистый токен.
      # В Kaggle токен называется gha-okv.
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN_OKV }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Kaggle CLI (>= 1.8.0)
        run: |
          pip install -q --upgrade kaggle
          kaggle --version
          python - <<'EOF'
          import re, subprocess
          out = subprocess.check_output(["kaggle", "--version"], text=True).strip()
          m = re.search(r"(\d+)\.(\d+)", out)
          assert m and tuple(map(int, m.groups())) >= (1, 8), \
              f"нужен kaggle CLI >= 1.8.0 для API-токенов, получен: {out}"
          print("OK: kaggle CLI >= 1.8.0")
          EOF

      - name: Download latest kernel output
        run: |
          mkdir -p ./output
          kaggle kernels output eavprog/okv-classifier-downloader -p ./output
          echo "Содержимое output:"
          find ./output -maxdepth 4 -type f | head -40
          echo ""
          echo "--- диагностика логов тетрадки (если есть) ---"
          for f in ./output/okv_data/diag/okv_diagnostics.json ./output/*.log ./output/*.txt; do
            [ -f "$f" ] && { echo ">>> $f (last 50 lines) >>>"; tail -n 50 "$f"; echo "<<< $f <<<"; echo ""; }
          done || true

      - name: Detect SRC and copy web files (.gz only)
        id: copy
        run: |
          # Авто-детект по §3.1: okv_data/web (стандарт) → web (фоллбэк).
          # Публикуются ТОЛЬКО .gz (fallback .json убран, §2.10).
          SRC=""
          for cand in "./output/okv_data/web" "./output/web"; do
            if [ -f "$cand/okv.json.gz" ]; then
              SRC="$cand"
              break
            fi
          done
          if [ -z "$SRC" ]; then
            echo "::warning::okv.json.gz не найден ни в ./output/okv_data/web, ни в ./output/web"
            echo "FILES_OK=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "SRC=$SRC"
          MISSING=0
          for f in okv.json.gz okv_meta.json.gz; do
            if [ -f "$SRC/$f" ]; then
              cp "$SRC/$f" "./$f"
              echo "copied $f"
            else
              echo "::warning::MISSING $f в $SRC (тетрадка, вероятно, упала)"
              MISSING=$((MISSING+1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "❌ Отсутствует $MISSING из 2 .gz файлов — коммит пропущен, сайт остаётся на последней хорошей версии"
            echo "FILES_OK=false" >> "$GITHUB_ENV"
          else
            echo "✅ Оба .gz файла на месте"
            echo "FILES_OK=true" >> "$GITHUB_ENV"
          fi

      - name: Check metadata (META_OK)
        id: meta
        if: env.FILES_OK == 'true'
        run: |
          python - <<'EOF'
          import gzip, hashlib, json, os, re

          with gzip.open("okv_meta.json.gz", "rt", encoding="utf-8") as f:
              m = json.load(f)

          ok = True
          reasons = []

          # 1. publish_allowed
          if m.get("publish_allowed") is not True:
              ok = False
              reasons.append(f"publish_allowed={m.get('publish_allowed')}")

          # 2. critical_errors
          ce = m.get("critical_errors")
          if ce:
              ok = False
              reasons.append(f"critical_errors={ce}")

          # 3. records_count > 0
          rc = m.get("records_count")
          if not isinstance(rc, int) or rc <= 0:
              ok = False
              reasons.append(f"records_count={rc}")

          # 4. data_hash_full — 64 hex-символа
          declared_full = m.get("data_hash_full") or ""
          declared_short = m.get("data_hash") or ""
          if not declared_full:
              ok = False
              reasons.append("data_hash_full отсутствует в мете")
          elif not re.fullmatch(r"[0-9a-f]{64}", str(declared_full)):
              ok = False
              reasons.append(f"data_hash_full невалидный: {declared_full}")

          # 5. data_hash == data_hash_full[:16] (§3.1) — блокирует
          if declared_short and declared_full and declared_short != declared_full[:16]:
              ok = False
              reasons.append(
                  f"data_hash != data_hash_full[:16]: short={declared_short} full_prefix={declared_full[:16]}"
              )

          # 6. Информационная сверка sha256(okv.json) с data_hash_full — НЕ блокирует.
          #    Семантика data_hash_full в ОКВ пока не подтверждена как sha256-от-байтов
          #    (в OKZ подтвердили и подняли до блокирующей; в ОКОПФ, ОКОГУ, ОКФС, ОКОФ — нет).
          #    Пока — только лог. Если подтвердится — снять комментарий и добавить ok = False.
          if declared_full:
              try:
                  with gzip.open("okv.json.gz", "rb") as f:
                      content = f.read()
                  actual_full = hashlib.sha256(content).hexdigest()
                  if declared_full == actual_full:
                      print(f"✓ sha256(okv.json) == data_hash_full ({actual_full[:16]}…)")
                  else:
                      print(f"  ⚠ sha256(okv.json)={actual_full[:16]}… != data_hash_full={declared_full[:16]}… (информационно, не блокирует)")
              except Exception as e:
                  print(f"  ⚠ не удалось сверить sha256(okv.json): {e}")

          if ok:
              print("✓ META_OK: publish_allowed=true, critical_errors=[], records_count>0, data_hash == data_hash_full[:16]")
              with open(os.environ["GITHUB_ENV"], "a") as env:
                  env.write("META_OK=true\n")
          else:
              print("::error::Мета не прошла проверку:")
              for r in reasons:
                  print(f"  - {r}")
              with open(os.environ["GITHUB_ENV"], "a") as env:
                  env.write("META_OK=false\n")
          EOF

      - name: Commit and push changes
        if: env.FILES_OK == 'true' && env.META_OK == 'true'
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"
          git add okv.json.gz okv_meta.json.gz
          if git diff --cached --quiet; then
            echo "✅ Изменений нет — данные уже актуальны"
          else
            # SOURCE_DATE через gzip -d -c | python -c (как в ОКФС/ОКОГУ/ОКОПФ/ОКОФ; без heredoc).
            # Цепочка: source_date → effective_date → prepared_date → generated_at → '?'.
            # Для ОКВ source_date в мете отсутствует (classifikators), реально сработает effective_date.
            SOURCE_DATE=$(gzip -d -c okv_meta.json.gz | python -c "import sys, json; m=json.load(sys.stdin); print(m.get('source_date') or m.get('effective_date') or m.get('prepared_date') or m.get('generated_at') or '?')")
            git commit -m "Auto-update: okv data (source ${SOURCE_DATE}) [skip ci]"
            git push
            echo "✅ Изменения запушены (source=${SOURCE_DATE})"
          fi

      - name: Trigger new notebook run (fire-and-forget, always)
        if: always()
        run: |
          mkdir -p ./nb
          kaggle kernels pull eavprog/okv-classifier-downloader -p ./nb --metadata
          kaggle kernels push -p ./nb
          echo "✅ Тетрадка перезапущена (round-trip); workflow не ждёт её завершения"
